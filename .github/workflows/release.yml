name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # semantic-release commits version bumps and changelog updates as the bot user
      - run: git config user.name "semantic-release-bot"
      - run: git config user.email "semantic-release-bot@users.noreply.github.com"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 24 bundles npm 11
      - run: npm install -g npm@11
      - run: bun install --frozen-lockfile
      # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN required
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          HUSKY: '0'
